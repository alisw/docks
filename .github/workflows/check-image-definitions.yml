---
# Check that declared Packer images are valid.
name: Validate Packer images

'on':
  - push
  - pull_request

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install prerequisites
        run: |
          sudo apt update -y

          # The packer provided by Ubuntu repos is ancient. apt-key is gone
          # from Ubuntu 26.04 (ubuntu-latest since November 2026), so the
          # HashiCorp key goes into a keyring the source names with signed-by.
          curl -fsSL https://apt.releases.hashicorp.com/gpg |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer
          packer plugins install github.com/hashicorp/docker

      - name: Validate Packer images
        run: |
          error=0
          for decl in */packer.json; do
            pushd "$(dirname "$decl")"
            if ! packer validate packer.json; then
              echo -n "::error file=$decl,line=1,title=packer validate failed"
              echo "::Packer validation failed for $decl."
              error=1
            fi
            popd
          done
          exit $error
