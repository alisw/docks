---
# Build and push the selected docker image from a packer config.

name: Push Docker image

# Controls when the action will run: manual trigger with a parameter
'on':
  workflow_dispatch:
    inputs:
      image-name:
        description: Docker image to build
        required: true
        default: slc9-builder
      arch:
        description: >-
          Architecture to build for. Packer's docker builder produces an image
          for the host it runs on, so this selects the runner rather than any
          build flag -- there is no cross-compilation and no QEMU.
        required: false
        type: choice
        default: amd64
        options: [amd64, arm64]
      image-tag:
        description: >-
          Tag to publish. Leave empty for the default: "latest" on amd64 and
          "latest-arm64" on arm64. An arm build MUST NOT be pushed to "latest"
          -- that tag is a single-arch amd64 manifest which several Nomad jobs
          pin by digest, and overwriting it would break every one of them.
        required: false
        default: ''

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    # ubuntu-24.04-arm is a native arm64 runner, free for public repos.
    runs-on: >-
      ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Some images are too large and we run out of disk space, so try to free some
      - name: Free disk space
        run: |
          # https://github.com/jlumbroso/free-disk-space
          set -ex
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Install prerequisites
        run: |
          sudo apt update -y
          sudo apt install -y software-properties-common
          sudo add-apt-repository universe

          # containerd.io conflicts with docker.io
          sudo apt-get remove containerd.io
          sudo apt install -y docker.io

          # The packer provided by Ubuntu repos is ancient
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository \
            "deb [arch=$(dpkg --print-architecture)] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install packer
          packer plugins install github.com/hashicorp/docker
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Log in to Docker repo
        run: |
          docker login registry.cern.ch -u '${{ secrets.CERN_REGISTRY_USER }}' --password-stdin <<\EOF
          ${{ secrets.CERN_REGISTRY_PASSWORD }}
          EOF

      - name: Build and push docker image
        run: |
          if ! cd "$GITHUB_WORKSPACE/${{ github.event.inputs.image-name }}"; then
            echo 'error: requested docker image not defined in this repo' >&2
            exit 1
          fi
          TAG="${{ inputs.image-tag }}"
          if [ -z "$TAG" ]; then
            case "${{ inputs.arch }}" in
              arm64) TAG=latest-arm64 ;;
              *)     TAG=latest       ;;
            esac
          fi
          echo "publishing ${{ inputs.image-name }}:$TAG for ${{ inputs.arch }}"
          packer validate -var "TAG=$TAG" packer.json
          packer build    -var "TAG=$TAG" packer.json
          docker push "registry.cern.ch/alisw/${{ inputs.image-name }}:$TAG"
